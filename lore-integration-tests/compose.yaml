# Note: anything you rely on for running integration tests
# should also have a non-docker equivalent in scripts/actions/test-integration.sh
name: integration-tests

services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=lorelocal
      - MINIO_ROOT_PASSWORD=lorelocal
    command: server --console-address :9001 /data
  dynamodb:
    image: amazon/dynamodb-local
    ports:
      - "9090:9090"
    init: true
    restart: on-failure
    environment:
      - AWS_ACCESS_KEY_ID=lorelocal
      - AWS_SECRET_ACCESS_KEY=lorelocal
      - AWS_REGION=us-east-1
    command: "-jar DynamoDBLocal.jar -port 9090 -inMemory -sharedDb"
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.6.2
    ports:
      - "127.0.0.1:1411:1411"
    environment:
      # APP_URL is the issuer PocketID advertises and signs tokens with, so it has
      # to be the address tests reach it on. The http:// scheme also switches the
      # session cookie name from __Host-access_token to access_token.
      - APP_URL=http://127.0.0.1:1411
      # NOTE: these credentials are just hardcoded here, same as the minio ones above.
      # STATIC_API_KEY provisions an admin "Static API User" on first boot, which is
      # what lets the fixtures skip the interactive setup wizard entirely.
      - STATIC_API_KEY=lorelocaltestapikeylorelocaltestapikey
      - ENCRYPTION_KEY=bG9yZWxvY2FsLWludGVncmF0aW9uLXRlc3RzLWtleTE=
      # Keep a test container from phoning home to analytics and the GitHub release feed.
      - ANALYTICS_DISABLED=true
      - VERSION_CHECK_DISABLED=true
      # The fixtures create one-time access tokens in a tight loop; the default limiter
      # (5 exchanges per 10s) fails tests that have done nothing wrong.
      - DISABLE_RATE_LIMITING=true
  consul-server:
    image: hashicorp/consul:latest
    container_name: consul-server
    ports:
      - "8500:8500"
    volumes:
      - ./consul-data:/consul/data
    command: agent -server -bootstrap-expect=1 -data-dir=/consul/server/data -node=consul-server-1 -client=0.0.0.0 -ui
  consul-node-1:
    depends_on:
      - consul-server
    image: hashicorp/consul:latest
    container_name: consul-node-1
    volumes:
      - ./consul-data:/consul/data
    command: agent -data-dir=/consul/node-1/data -node=consul-node-1 -retry-join=consul-server
